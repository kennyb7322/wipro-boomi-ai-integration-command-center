name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the single-file command center
        run: node scripts/build.mjs
      - name: Pre-ship checks
        run: node scripts/check.mjs
      - name: Committed output is current
        run: git diff --exit-code -- dist index.html
      - uses: actions/upload-artifact@v4
        with:
          name: command-center
          path: dist/*.html
